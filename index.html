
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080611">
<title>NIGHTCITY: NO GOOD ENDINGS</title>
<style>
:root{--cyan:#65f5ff;--pink:#ff397b;--violet:#b16bff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080611;color:#fff;font-family:monospace}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100%;height:100%;max-width:1100px;max-height:850px;overflow:hidden;background:#080611}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.panel{background:#080611e8;border:1px solid #65f5ff70;padding:8px 10px;font-size:11px}
.brand{font-weight:bold;color:var(--cyan);font-size:12px;letter-spacing:2px}
#mission{margin-top:5px;color:#e7dfff;max-width:220px;line-height:1.5}
.stat{margin-bottom:5px;color:#ddd}
.bar{height:5px;width:100px;background:#272138;margin-top:4px}
.bar span{height:100%;display:block;background:var(--cyan);width:100%}
#boostbar{background:var(--pink)}
#toast{position:absolute;top:91px;left:50%;transform:translateX(-50%);color:var(--cyan);font-size:10px;text-align:center;letter-spacing:1px;text-shadow:0 0 10px #65f5ff;white-space:nowrap}
#dialogue{position:absolute;left:10px;right:10px;bottom:99px;display:none;grid-template-columns:85px 1fr;gap:10px;align-items:stretch;background:linear-gradient(110deg,#100c23f5,#090816f2);border:1px solid #65f5ffbb;box-shadow:0 0 22px #65f5ff20;min-height:112px;padding:8px;pointer-events:auto}
#portrait{position:relative;min-height:94px;overflow:hidden;background:#171027;border:1px solid #ffffff28}
#portrait canvas{width:100%;height:100%;position:absolute;inset:0}
#speaker{font-size:11px;color:var(--cyan);font-weight:bold;letter-spacing:2px;margin:2px 0 7px}
#words{font-size:12px;line-height:1.55;color:#fff;white-space:pre-wrap}
#next{position:absolute;right:8px;bottom:4px;font-size:10px;color:var(--pink);background:none;border:0;font-family:inherit;padding:8px;cursor:pointer}
#controls{position:absolute;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.cluster{display:flex;gap:7px;pointer-events:auto}
.ctrl{width:54px;height:50px;background:#100d20e8;border:1px solid #65f5ff7a;color:white;font:bold 17px monospace;touch-action:none;border-radius:7px;user-select:none;-webkit-user-select:none}
.ctrl:active,.ctrl.on{background:#224451;border-color:var(--cyan)}
.ctrl.boost{color:#ff6f9c;border-color:#ff397b99;font-size:12px}
#screen{position:absolute;inset:0;background:#080611eF;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;z-index:5}
#screen.hidden{display:none}
.card{max-width:470px;width:100%;border:1px solid #65f5ff8c;background:#0b0918f5;padding:24px 18px;box-shadow:0 0 40px #a14bff20}
.eyebrow{font-size:10px;color:var(--pink);letter-spacing:4px}
h1{font-size:clamp(28px,7vw,54px);line-height:1.02;margin:13px 0;color:#fff;text-shadow:3px 3px #ff397b,-2px -2px #65f5ff}
.subtitle{font-size:11px;color:#c8bddc;line-height:1.8}
.start{background:var(--cyan);color:#090816;border:0;padding:15px 22px;margin-top:18px;font:bold 13px monospace;letter-spacing:2px;cursor:pointer;touch-action:manipulation}
.small{font-size:10px;color:#9b91b5;line-height:1.7;margin-top:15px}
@media(min-width:700px){
 #dialogue{left:7%;right:7%;bottom:90px;grid-template-columns:130px 1fr;min-height:130px;padding:12px}
 #portrait{min-height:105px}
 #words{font-size:14px}
 .ctrl{width:62px;height:56px}
}
@media(max-height:520px){
 #dialogue{bottom:70px;min-height:78px;grid-template-columns:60px 1fr;padding:5px}
 #portrait{min-height:65px}
 #words{font-size:10px;line-height:1.35}
 #speaker{margin:1px 0 3px}
 .ctrl{height:38px;width:46px}
 #controls{bottom:4px}
 .top{top:4px}
}
</style>
</head>
<body>
<div id="game">
<canvas id="c" width="480" height="800"></canvas>

<div id="hud">
 <div class="top">
  <div class="panel">
   <div class="brand">NIGHTCITY // N.G.E.</div>
   <div id="mission">SIGNAL LOST — FIND DAVID</div>
  </div>
  <div class="panel" style="min-width:116px">
   <div class="stat">HULL <span id="healthText">100</span>%</div>
   <div class="bar"><span id="healthbar"></span></div>
   <div class="stat" style="margin-top:8px">BOOST</div>
   <div class="bar"><span id="boostbar"></span></div>
   <div class="stat" style="margin-top:8px">MEMORY <span id="chips">0</span>/3</div>
  </div>
 </div>

 <div id="toast">NIGHT CITY // 03:17 AM</div>

 <div id="dialogue">
  <div id="portrait"><canvas id="face" width="100" height="100"></canvas></div>
  <div>
   <div id="speaker">LUCY</div>
   <div id="words"></div>
  </div>
  <button id="next">CONTINUE ▶</button>
 </div>

 <div id="controls">
  <div class="cluster">
   <button class="ctrl" data-key="left" aria-label="Steer left">◀</button>
   <button class="ctrl" data-key="right" aria-label="Steer right">▶</button>
  </div>
  <div class="cluster">
   <button class="ctrl" data-key="brake" aria-label="Brake">▼</button>
   <button class="ctrl boost" data-key="boost" aria-label="Boost">BOOST</button>
  </div>
 </div>

 <div id="screen">
  <div class="card">
   <div class="eyebrow">A NIGHT CITY STORY</div>
   <h1>NIGHTCITY:<br>NO GOOD ENDINGS</h1>
   <div class="subtitle">
    THE CITY TOOK HIS BODY.<br>
    ARASAKA TOOK HIS MEMORIES.<br>
    SHE KEPT THE LAST PIECE.
   </div>
   <button class="start" data-action="start">JACK IN</button>
   <div class="small">
    STEER: ◀ ▶ / A D<br>
    BOOST: SPACE · BRAKE: S / ↓<br>
    TOUCH CONTROLS AVAILABLE
   </div>
  </div>
 </div>
</div>

<audio id="endingSong" src="ending-song.mp3" preload="auto"></audio>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const canvas = $('c');
const ctx = canvas.getContext('2d');
const face = $('face');
const f = face.getContext('2d');

const W = 480, H = 800;
const keys = {left:false,right:false,boost:false,brake:false};

let state = 'menu';
let resumeState = 'drive';
let lines = [];
let lineIndex = 0;
let dialogueDone = null;
let clock = 0;
let driveTime = 0;
let phaseTime = 0;
let roadOffset = 0;
let spawnTimer = 0;
let enemyTimer = 3;
let shake = 0;
let health = 100;
let boost = 100;
let fragments = 0;
let score = 0;
let stage = 0;
let endingSongStarted = false;
let endingSongFailed = false;
let endingStartTime = 0;
let lastTime = 0;

const player = {x:240,y:625,tilt:0};
let cars = [];
let chips = [];
let particles = [];
let buildings = [];

const intro = [
 ['LUCY','They told me you were dead, David. I believed them.'],
 ['LUCY','Then an Arasaka courier started playing our song.'],
 ['LUCY','Your body is out there somewhere. Your memories are on this chip.'],
 ['LUCY','I am coming for you. Hold on, choom.']
];

const radio = [
 ['ARASAKA COMMS','UNREGISTERED VEHICLE DETECTED. SURRENDER THE MEMORY CHIP.'],
 ['LUCY','Yeah, choom. That sounds like a request I can ignore.'],
 ['LUCY','Roadblock ahead. Keep the wheels moving.']
];

const bikeIntro = [
 ['LUCY','Car is finished. Guess we are doing this the hard way.'],
 ['LUCY','Three memory fragments. That is all I have left to bring him back.'],
 ['DAVID','...I really wanna stay.'],
 ['LUCY','You still know the song. Somewhere in there, you still know.']
];

const finalRide = [
 ['ARASAKA COMMS','INTERCEPTOR DEPLOYED. DO NOT LET THE TARGET ESCAPE.'],
 ['LUCY','Last vehicle. Last road out of this city.'],
 ['DAVID','I know every note of this song. Why can’t I remember who it belongs to?']
];

const finalLines = [
 ['LUCY','David?'],
 ['DAVID','...Who are you?'],
 ['LUCY','It’s me. I found you. I brought your memories back.'],
 ['DAVID','I don’t know you.'],
 ['LUCY','You promised we would leave this city together.'],
 ['DAVID','I’m sorry.']
];

function rand(n){return Math.abs(Math.sin(n*127.1+311.7)*43758.5453)%1}
function rect(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}
function label(text,x,y,size,color='#fff',align='left'){
 ctx.fillStyle=color;
 ctx.font=`${size}px monospace`;
 ctx.textAlign=align;
 ctx.fillText(text,x,y);
}
function makeBuildings(){
 buildings=[];
 for(let i=0;i<35;i++){
  buildings.push({
   x:i%2===0?3+rand(i)*62:414+rand(i+2)*58,
   y:rand(i+5)*800,
   w:25+rand(i+8)*38,
   h:50+rand(i+11)*115,
   col:['#15112b','#21102f','#101e31','#25152b'][i%4],
   seed:i
  });
 }
}
makeBuildings();

function drawRoad(){
 const grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,'#0b0920');
 grad.addColorStop(.55,'#111024');
 grad.addColorStop(1,'#090813');
 ctx.fillStyle=grad;
 ctx.fillRect(0,0,W,H);

 for(let i=0;i<75;i++){
  const x=rand(i)*W;
  const y=(rand(i+100)+clock*.025)%1*H;
  rect(x,y,1,1,i%3===0?'#ff5e9d':'#69eaff');
 }

 buildings.forEach(b=>{
  const y=(b.y+clock*24)%900-100;
  rect(b.x,y,b.w,b.h,b.col);
  rect(b.x+3,y+5,2,b.h-8,'#2e2046');
  for(let yy=y+8;yy<y+b.h-5;yy+=12){
   for(let xx=b.x+5;xx<b.x+b.w-3;xx+=9){
    if(rand(Math.floor(xx*2+yy+b.seed))>.45)
     rect(xx,yy,3,5,rand(xx+yy)>.5?'#fd478c':'#53deed');
   }
  }
 });

 rect(82,0,316,H,'#171525');
 rect(89,0,302,H,'#202033');
 rect(86,0,3,H,'#ff397b');
 rect(391,0,3,H,'#65f5ff');

 for(let y=-40;y<H;y+=72){
  const yy=(y+roadOffset)%H;
  rect(237,yy,4,32,'#67617e');
  rect(106,yy,2,22,'#343047');
  rect(372,yy,2,22,'#343047');
 }

 rect(10,170,63,27,'#16102a');
 rect(12,172,59,2,'#ff397b');
 label('ARASAKA',16,188,8,'#ff7ba8');
}

function drawCar(x,y,color='red',scale=1,enemy=false){
 const s=scale,w=30*s,h=48*s;
 rect(x-w/2+4*s,y+5*s,w-8*s,h,'#080610');
 rect(x-w/2+3*s,y+3*s,w-6*s,h-4*s,color);
 rect(x-w/2+6*s,y+8*s,w-12*s,10*s,'#252a40');
 rect(x-w/2+7*s,y+9*s,w-14*s,6*s,enemy?'#ff397b':'#64dce9');
 rect(x-w/2+5*s,y+21*s,w-10*s,12*s,'#25243b');
 rect(x-w/2+2*s,y+37*s,5*s,7*s,'#ff456b');
 rect(x+w/2-7*s,y+37*s,5*s,7*s,'#ff456b');
 rect(x-w/2+1*s,y+12*s,4*s,10*s,'#aab1c5');
 rect(x+w/2-5*s,y+12*s,4*s,10*s,'#aab1c5');
 if(enemy){
  rect(x-11*s,y+15*s,22*s,3*s,'#ff397b');
  rect(x-2*s,y+18*s,4*s,5*s,'#65f5ff');
 }
}
function drawBike(x,y){
 rect(x-4,y+5,8,35,'#0a0914');
 rect(x-7,y+3,14,12,'#20233a');
 rect(x-4,y+16,8,12,'#d8d8e8');
 rect(x-6,y+25,12,8,'#ff397b');
 rect(x-10,y+33,20,4,'#1c1b2e');
 rect(x-2,y+37,4,6,'#ff8cae');
 rect(x-4,y,8,5,'#65f5ff');
}

function lucy(x,y,s=1){
 const p=(a,b,w,h,col)=>rect(x+a*s,y+b*s,w*s,h*s,col);
 p(9,0,10,3,'#d9dce9');p(6,3,17,4,'#cbd2e7');
 p(5,7,20,10,'#e9e5ef');p(8,10,3,3,'#eaffff');
 p(19,10,3,3,'#eaffff');p(8,14,13,8,'#e7b3a4');
 p(5,20,21,13,'#c82d68');p(9,22,14,9,'#e84379');
 p(1,23,7,17,'#e7b5b1');p(24,23,7,17,'#e7b5b1');
 p(5,32,22,10,'#16182e');p(7,42,7,7,'#d7d4e5');
 p(19,42,7,7,'#d7d4e5');p(4,47,11,3,'#65f5ff');
 p(19,47,11,3,'#65f5ff');
}
function david(x,y,s=1,android=false){
 const p=(a,b,w,h,col)=>rect(x+a*s,y+b*s,w*s,h*s,col);
 p(7,0,17,4,'#171622');p(5,3,21,5,'#f1d6bb');
 p(4,7,23,11,'#f1d6bb');p(8,9,4,2,android?'#ff397b':'#201c2a');
 p(19,9,4,2,android?'#ff397b':'#201c2a');
 p(9,15,12,2,'#9c635c');p(7,19,19,8,'#f3cb4b');
 p(6,26,21,11,'#d7a52d');p(3,23,6,17,'#f1d6bb');
 p(25,23,6,17,'#f1d6bb');p(6,36,22,10,'#22253b');
 p(7,46,8,4,'#151526');p(20,46,8,4,'#151526');
 if(android){p(0,8,4,4,'#ff397b');p(28,8,4,4,'#ff397b');p(13,27,7,5,'#65f5ff')}
}
function drawPlayer(){
 if(stage===1)drawBike(player.x,player.y);
 else drawCar(player.x,player.y,stage===0?'#bb245e':stage===2?'#8d91ad':'#d5d8e4',stage===2?1.12:1);
 if(stage===2){
  rect(player.x-11,player.y+12,22,3,'#ff397b');
  rect(player.x-14,player.y+2,28,3,'#65f5ff');
 }
}
function drawFinalWorld(){
 rect(0,0,W,H,'#070611');
 for(let i=0;i<18;i++){
  const x=i*29%W,y=i*83%H;
  rect(x,y,22,150,['#121027','#18102c','#101c2a'][i%3]);
 }
 rect(0,580,W,220,'#11101d');
 rect(0,578,W,2,'#ff397b');
 lucy(115,435,3.2);
 david(300,435,3.2,true);
}

function draw(){
 if(state==='ending'||state==='finalDialogue'){
  drawFinalWorld();
 }else{
  drawRoad();
  chips.forEach(o=>{
   rect(o.x-8,o.y-8,16,16,'#19253b');
   rect(o.x-5,o.y-5,10,10,'#65f5ff');
   rect(o.x-2,o.y-2,4,4,'#fff');
  });
  cars.forEach(o=>{
   drawCar(o.x,o.y,o.kind==='enemy'?'#4b506c':'#55536b',o.kind==='enemy'?1:.9,o.kind==='enemy');
  });
  drawPlayer();
  particles.forEach(p=>rect(p.x,p.y,3,3,p.color));
 }
 for(let y=(clock*80)%8;y<H;y+=8)rect(0,y,W,1,'#ffffff05');
}

function portrait(who){
 f.fillStyle='#171027';f.fillRect(0,0,100,100);
 for(let i=0;i<20;i++){
  f.fillStyle=i%2?'#211337':'#182238';
  f.fillRect((i*29)%100,(i*17)%100,2,2);
 }
 function p(x,y,w,h,col){f.fillStyle=col;f.fillRect(x,y,w,h)}
 f.save();f.translate(18,10);f.scale(2,2);
 if(who==='DAVID'){
  p(7,0,17,4,'#171622');p(5,3,21,5,'#f1d6bb');
  p(4,7,23,11,'#f1d6bb');p(8,9,4,2,'#ff397b');
  p(19,9,4,2,'#ff397b');p(7,19,19,8,'#f3cb4b');
  p(6,26,21,11,'#d7a52d');p(6,36,22,10,'#22253b');
 }else if(who==='ARASAKA COMMS'){
  p(5,0,21,7,'#31354a');p(4,7,23,13,'#515970');
  p(7,10,17,4,'#ff397b');p(5,20,22,20,'#292d43');
 }else{
  p(9,0,10,3,'#d9dce9');p(6,3,17,4,'#cbd2e7');
  p(5,7,20,10,'#e9e5ef');p(8,10,3,3,'#eaffff');
  p(19,10,3,3,'#eaffff');p(8,14,13,8,'#e7b3a4');
  p(5,20,21,13,'#c82d68');p(9,22,14,9,'#e84379');
  p(5,32,22,10,'#16182e');
 }
 f.restore();p(0,93,100,2,'#65f5ff');
}

function showDialogue(newLines,after,resume='drive'){
 lines=newLines.map(a=>[...a]);
 lineIndex=0;dialogueDone=after||null;resumeState=resume;
 state='dialogue';
 $('dialogue').style.display='grid';
 $('controls').style.display='none';
 showLine();
}
function showLine(){
 const l=lines[lineIndex];
 $('speaker').textContent=l[0];
 $('words').textContent=l[1];
 portrait(l[0]);
 $('next').textContent=lineIndex===lines.length-1?'CONTINUE ▶':'NEXT ▶';
}
function nextDialogue(){
 if(state!=='dialogue')return;
 lineIndex++;
 if(lineIndex<lines.length){showLine();return}
 $('dialogue').style.display='none';
 const cb=dialogueDone;
 dialogueDone=null;
 if(cb){cb();return}
 state=resumeState;
 if(state==='drive')$('controls').style.display='flex';
}
$('next').addEventListener('click',nextDialogue);

function startGame(){
 $('screen').classList.add('hidden');
 resetRun();
 showDialogue(intro,()=>showDialogue(radio,()=>{state='drive';$('controls').style.display='flex'}));
}
function resetRun(){
 state='drive';clock=0;driveTime=0;phaseTime=0;roadOffset=0;
 spawnTimer=0;enemyTimer=3;health=100;boost=100;fragments=0;score=0;
 stage=0;cars=[];chips=[];particles=[];
 player.x=240;player.y=625;player.tilt=0;
 endingSongStarted=false;endingSongFailed=false;
 $('endingSong').pause();$('endingSong').currentTime=0;
 $('controls').style.display='flex';
 $('toast').textContent='DON’T LET THEM TAKE THE CHIP';
 updateHUD();
}

$('screen').addEventListener('click',e=>{
 const btn=e.target.closest('[data-action]');
 if(!btn)return;
 const action=btn.dataset.action;
 if(action==='start')startGame();
 if(action==='restart'){
  $('screen').innerHTML=menuMarkup();
  startGame();
 }
});
function menuMarkup(){
 return `<div class="card"><div class="eyebrow">A NIGHT CITY STORY</div><h1>NIGHTCITY:<br>NO GOOD ENDINGS</h1><div class="subtitle">THE CITY TOOK HIS BODY.<br>ARASAKA TOOK HIS MEMORIES.<br>SHE KEPT THE LAST PIECE.</div><button class="start" data-action="start">JACK IN</button><div class="small">STEER: ◀ ▶ / A D<br>BOOST: SPACE · BRAKE: S / ↓<br>TOUCH CONTROLS AVAILABLE</div></div>`;
}

function spawnCar(){
 const lane=[130,185,295,350][Math.floor(Math.random()*4)];
 cars.push({x:lane,y:-65,kind:Math.random()<.36?'enemy':'traffic',speed:75+Math.random()*90,hit:false});
}
function spawnChip(){
 chips.push({x:120+Math.random()*240,y:-20});
}
function hit(a,b,pad=22){return Math.abs(a.x-b.x)<pad&&Math.abs(a.y-b.y)<pad+12}
function damage(n){
 health-=n;shake=6;
 for(let i=0;i<8;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,life:.4,color:'#ff397b'});
 if(health<=0){
  health=60;boost=Math.max(10,boost-25);player.x=240;cars=[];
  $('toast').textContent='VEHICLE REBOOT // KEEP MOVING';
 }
}
function updateHUD(){
 $('healthText').textContent=Math.max(0,Math.ceil(health));
 $('healthbar').style.width=Math.max(0,health)+'%';
 $('boostbar').style.width=boost+'%';
 $('chips').textContent=fragments;
 const missions=[
  'ESCAPE THE ARASAKA ROADBLOCK',
  'MOTORCYCLE PHASE // COLLECT MEMORY',
  'ARMORED INTERCEPTOR // LEAVE THE CITY'
 ];
 $('mission').textContent=missions[Math.min(stage,2)];
}
function changeStage(n){
 stage=n;phaseTime=0;cars=[];chips=[];spawnTimer=0;enemyTimer=2;
 if(n===1){
  showDialogue(bikeIntro,()=>{state='drive';$('controls').style.display='flex'});
  $('toast').textContent='VEHICLE CHANGE // MOTORCYCLE';
 }else if(n===2){
  showDialogue(finalRide,()=>{state='drive';$('controls').style.display='flex'});
  $('toast').textContent='VEHICLE CHANGE // ARMORED INTERCEPTOR';
 }
 updateHUD();
}
function finishRide(){
 state='finalDialogue';
 showDialogue(finalLines,beginEnding,'ending');
}
function beginEnding(){
 state='ending';
 $('dialogue').style.display='none';
 $('controls').style.display='none';
 $('toast').textContent='SIGNAL LOST';
 endingStartTime=clock;
 const song=$('endingSong');
 song.currentTime=0;
 song.play().then(()=>{endingSongStarted=true}).catch(()=>{
  endingSongFailed=true;
  $('toast').textContent='Song unavailable — check ending-song.mp3';
 });
}
function update(dt){
 clock+=dt;
 if(state!=='drive')return;

 driveTime+=dt;phaseTime+=dt;
 const fast=keys.boost&&boost>0&&!keys.brake;
 const speed=fast?345:keys.brake?115:230;
 if(fast)boost=Math.max(0,boost-dt*32);
 else boost=Math.min(100,boost+dt*12);
 roadOffset=(roadOffset+speed*dt)%72;

 const steer=(keys.left?-1:0)+(keys.right?1:0);
 player.x=Math.max(108,Math.min(372,player.x+steer*250*dt));
 player.tilt=steer;

 spawnTimer-=dt;enemyTimer-=dt;
 if(spawnTimer<=0){spawnCar();spawnTimer=.72+Math.random()*.5}
 if(enemyTimer<=0&&driveTime>4){
  cars.push({x:player.x+(Math.random()>.5?-75:75),y:-90,kind:'enemy',speed:140,hit:false});
  enemyTimer=3.8+Math.random()*1.5;
 }
 if(stage>=1&&Math.random()<dt*.38&&chips.length<2)spawnChip();

 cars.forEach(o=>{
  o.y+=(speed*.8+o.speed)*dt;
  if(o.kind==='enemy'&&o.y>80&&o.y<650)o.x+=(player.x-o.x)*dt*.17;
  if(o.y>H+70)o.dead=true;
  if(hit(player,o,24)&&!o.hit){o.hit=true;o.dead=true;damage(o.kind==='enemy'?19:11);score=Math.max(0,score-50)}
 });
 cars=cars.filter(o=>!o.dead);

 chips.forEach(o=>{
  o.y+=speed*dt;
  if(hit(player,o,22)){
   o.dead=true;fragments++;score+=150;boost=Math.min(100,boost+22);
   for(let i=0;i<10;i++)particles.push({x:o.x,y:o.y,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90,life:.4,color:'#65f5ff'});
   $('toast').textContent='MEMORY FRAGMENT ACQUIRED';
  }
 });
 chips=chips.filter(o=>!o.dead&&o.y<H+20);
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});
 particles=particles.filter(p=>p.life>0);

 // Three distinct playable vehicle phases.
 if(stage===0&&phaseTime>=16)changeStage(1);
 else if(stage===1&&phaseTime>=19)changeStage(2);
 else if(stage===2&&phaseTime>=19)finishRide();

 updateHUD();
}
function loop(t){
 if(!lastTime)lastTime=t;
 const dt=Math.min(.035,(t-lastTime)/1000);
 lastTime=t;
 if(state==='drive')update(dt);
 else if(state==='dialogue')clock+=dt;
 else if(state==='ending'){
  clock+=dt;
  if(clock-endingStartTime>7&&$('screen').classList.contains('hidden')){
   $('screen').innerHTML='<div class="card"><div class="eyebrow">CONNECTION TERMINATED</div><h1>NO GOOD<br>ENDINGS.</h1><div class="subtitle">THE CITY REMEMBERS.<br>DAVID DOESN’T.</div><button class="start" data-action="restart">RESTART RUN</button><div class="small">THE SONG CONTINUES.</div></div>';
   $('screen').classList.remove('hidden');
  }
 }
 ctx.save();
 if(shake>0&&state==='drive')ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 draw();
 ctx.restore();
 if(shake>0)shake=Math.max(0,shake-dt*20);
 requestAnimationFrame(loop);
}

addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(['arrowleft','arrowright','arrowdown','arrowup',' '].includes(k))e.preventDefault();
 if(k==='arrowleft'||k==='a')keys.left=true;
 if(k==='arrowright'||k==='d')keys.right=true;
 if(k===' '||k==='w'||k==='arrowup')keys.boost=true;
 if(k==='s'||k==='arrowdown')keys.brake=true;
 if(k==='enter'&&state==='dialogue')nextDialogue();
});
addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();
 if(k==='arrowleft'||k==='a')keys.left=false;
 if(k==='arrowright'||k==='d')keys.right=false;
 if(k===' '||k==='w'||k==='arrowup')keys.boost=false;
 if(k==='s'||k==='arrowdown')keys.brake=false;
});
document.querySelectorAll('.ctrl').forEach(btn=>{
 const key=btn.dataset.key;
 const down=e=>{e.preventDefault();keys[key]=true;btn.classList.add('on')};
 const up=e=>{e.preventDefault();keys[key]=false;btn.classList.remove('on')};
 btn.addEventListener('pointerdown',down);
 btn.addEventListener('pointerup',up);
 btn.addEventListener('pointercancel',up);
 btn.addEventListener('lostpointercapture',up);
});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden)Object.keys(keys).forEach(k=>keys[k]=false);
});
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
